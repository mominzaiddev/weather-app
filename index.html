<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <h1>Weather Check</h1>
    <p class="subtitle">Search any city to see current conditions</p>

    <form id="search-form" class="search-form">
      <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off" required />
      <button type="submit">Search</button>
    </form>

    <div id="status" class="status"></div>

    <div id="weather-card" class="weather-card hidden">
      <div class="location">
        <h2 id="city-name"></h2>
        <span id="country-name"></span>
      </div>

      <div class="main-info">
        <span id="temperature" class="temperature"></span>
        <span id="weather-desc" class="weather-desc"></span>
      </div>

      <div class="details">
        <div class="detail-item">
          <span class="label">Feels like</span>
          <span id="feels-like" class="value"></span>
        </div>
        <div class="detail-item">
          <span class="label">Humidity</span>
          <span id="humidity" class="value"></span>
        </div>
        <div class="detail-item">
          <span class="label">Wind</span>
          <span id="wind" class="value"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
